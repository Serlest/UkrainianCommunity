name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "integration/**"
      - "release/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Change classification and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firebase: ${{ steps.classify.outputs.firebase }}
      functions: ${{ steps.classify.outputs.functions }}
      rules: ${{ steps.classify.outputs.rules }}
      ios: ${{ steps.classify.outputs.ios }}
      ios_unit: ${{ steps.classify.outputs.ios_unit }}
      ios_ui_required: ${{ steps.classify.outputs.ios_ui_required }}
      ios_release: ${{ steps.classify.outputs.ios_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/classify_changes.py \
              --base "$PR_BASE_SHA" \
              --head "$GITHUB_SHA" \
              --github-output "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" != release/* ]]; then
            if [[ -n "$PUSH_BASE_SHA" && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$PUSH_BASE_SHA"
            else
              BASE_SHA="$(git merge-base origin/main "$GITHUB_SHA")"
            fi
            python3 scripts/classify_changes.py \
              --base "$BASE_SHA" \
              --head "$GITHUB_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/classify_changes.py --force-full --github-output "$GITHUB_OUTPUT"
          fi

      - name: Report required local UI validation
        if: steps.classify.outputs.ios_ui_required == 'true' && github.event_name != 'schedule'
        run: |
          {
            echo "### Local iOS UI validation required"
            echo
            echo "This change affects an iOS user path. Run the approved Mac/Xcode UI validation before release."
            echo "GitHub-hosted UI tests are intentionally disabled because Simulator infrastructure failures are not product-test evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test change classifier
        run: python3 scripts/test_classify_changes.py

      - name: Validate repository structure
        run: python3 scripts/validate_repository_structure.py

      - name: Validate localization catalog
        run: python3 scripts/validate_localizations.py

      - name: Validate shared content category contract
        run: python3 scripts/validate_content_category_contract.py

      - name: Validate Firestore index uniqueness
        run: python3 scripts/validate_firestore_indexes.py

      - name: Validate property lists and privacy manifests
        run: python3 scripts/validate_property_lists.py

      - name: Validate release configuration
        run: python3 scripts/validate_release_configuration.py

      - name: Validate bilingual legal document structure
        run: python3 scripts/validate_legal_documents.py

      - name: Verify full offline legal documents match published sources
        run: python3 scripts/generate_bundled_legal.py --check

      - name: Show legal and App Store impact of this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/advise_legal_changes.py --base "$PR_BASE_SHA" --head "$GITHUB_SHA"
          else
            python3 scripts/advise_legal_changes.py --base "$GITHUB_SHA^" --head "$GITHUB_SHA"
          fi

  firebase_affected:
    name: Firebase affected checks
    needs: changes
    if: needs.changes.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v5
        if: needs.changes.outputs.functions == 'true' || needs.changes.outputs.rules == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Audit production dependencies
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run audit:prod

      - name: Type-check
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run lint

      - name: Validate callable App Check policy
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run validate:app-check-policy

      - name: Run Functions unit tests
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:unit

      - name: Install pinned Firebase CLI
        if: needs.changes.outputs.functions == 'true' || needs.changes.outputs.rules == 'true'
        run: npm install --global firebase-tools@15.28.1

      - name: Run retention race integration test
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:retention:integration

      - name: Run push registration cleanup integration test
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:notifications:integration

      - name: Run comment moderation integration test
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:comments:integration

      - name: Run system log management integration test
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:system-logs:integration

      - name: Run scheduled publishing integration tests
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:scheduled-publishing:integration

      - name: Run organization moderation integration tests
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:organizations:integration

      - name: Run counter migration and reconciliation integration test
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:counters:integration

      - name: Run analytics v1 to v2 cutover integration test
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:analytics-cutover:integration

      - name: Test Firestore and Storage rules
        if: needs.changes.outputs.rules == 'true'
        working-directory: functions
        run: npm run test:rules:all

  firebase:
    name: Firebase and rules
    needs:
      - changes
      - firebase_affected
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve required-check status
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          AFFECTED_RESULT: ${{ needs.firebase_affected.result }}
        run: |
          [[ "$CLASSIFICATION_RESULT" == "success" ]]
          [[ "$AFFECTED_RESULT" == "success" || "$AFFECTED_RESULT" == "skipped" ]]

  ios_affected:
    name: iOS build and unit checks
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2
    steps:
      - uses: actions/checkout@v7

      - name: Verify pinned Xcode and simulator
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun simctl list devices available | grep -F "iPhone 17 Pro"

      - name: Build app target
        run: >
          xcodebuild
          -project UkrainianCommunity.xcodeproj
          -scheme UkrainianCommunity
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/UkrainianCommunityDerivedData"
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build

      - name: Build Release configuration
        if: needs.changes.outputs.ios_release == 'true'
        run: >
          xcodebuild
          -project UkrainianCommunity.xcodeproj
          -scheme UkrainianCommunity
          -configuration Release
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/UkrainianCommunityReleaseDerivedData"
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build

      - name: Run Swift unit tests
        if: needs.changes.outputs.ios_unit == 'true'
        run: >
          xcodebuild
          -project UkrainianCommunity.xcodeproj
          -scheme UkrainianCommunity
          -configuration Debug
          -destination "$IOS_TEST_DESTINATION"
          -derivedDataPath "$RUNNER_TEMP/UkrainianCommunityDerivedData"
          -resultBundlePath "$RUNNER_TEMP/UkrainianCommunityUnitTests.xcresult"
          CODE_SIGNING_ALLOWED=NO
          test
          -only-testing:UkrainianCommunityTests

      - name: Verify Swift unit tests were discovered
        if: ${{ always() && needs.changes.outputs.ios_unit == 'true' }}
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/UkrainianCommunityUnitTests.xcresult
          RESULT_SUMMARY: ${{ runner.temp }}/UkrainianCommunityUnitTests-summary.json
        run: |
          test -d "$RESULT_BUNDLE"
          xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" > "$RESULT_SUMMARY"
          python3 - "$RESULT_SUMMARY" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as summary_file:
              summary = json.load(summary_file)
          test_count = summary.get("totalTestCount")
          if not isinstance(test_count, int) or test_count < 1:
              raise SystemExit(f"Expected at least one Swift unit test, found {test_count!r}")
          print(f"Verified {test_count} discovered Swift unit tests")
          PY

      - name: Preserve Swift test diagnostics
        if: ${{ failure() && needs.changes.outputs.ios_unit == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-unit-xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/UkrainianCommunityUnitTests.xcresult
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS build and unit tests
    needs:
      - changes
      - ios_affected
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve required-check status
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          AFFECTED_RESULT: ${{ needs.ios_affected.result }}
        run: |
          [[ "$CLASSIFICATION_RESULT" == "success" ]]
          [[ "$AFFECTED_RESULT" == "success" || "$AFFECTED_RESULT" == "skipped" ]]
