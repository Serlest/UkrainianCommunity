name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "release/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Change classification and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firebase: ${{ steps.classify.outputs.firebase }}
      functions: ${{ steps.classify.outputs.functions }}
      rules: ${{ steps.classify.outputs.rules }}
      ios: ${{ steps.classify.outputs.ios }}
      ios_unit: ${{ steps.classify.outputs.ios_unit }}
      ios_ui: ${{ steps.classify.outputs.ios_ui }}
      ios_release: ${{ steps.classify.outputs.ios_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            python3 scripts/classify_changes.py --force-full --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/classify_changes.py \
              --base "$PR_BASE_SHA" \
              --head "$GITHUB_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Test change classifier
        run: python3 scripts/test_classify_changes.py

      - name: Validate repository structure
        run: python3 scripts/validate_repository_structure.py

      - name: Validate localization catalog
        run: python3 scripts/validate_localizations.py

      - name: Validate property lists and privacy manifests
        run: python3 scripts/validate_property_lists.py

      - name: Validate release configuration
        run: python3 scripts/validate_release_configuration.py

      - name: Validate bilingual legal document structure
        run: python3 scripts/validate_legal_documents.py

      - name: Verify full offline legal documents match published sources
        run: python3 scripts/generate_bundled_legal.py --check

      - name: Show legal and App Store impact of this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/advise_legal_changes.py --base "$PR_BASE_SHA" --head "$GITHUB_SHA"
          else
            python3 scripts/advise_legal_changes.py --base "$GITHUB_SHA^" --head "$GITHUB_SHA"
          fi

  firebase_affected:
    name: Firebase affected checks
    needs: changes
    if: needs.changes.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v5
        if: needs.changes.outputs.functions == 'true' || needs.changes.outputs.rules == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Audit production dependencies
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run audit:prod

      - name: Type-check
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run lint

      - name: Run Functions unit tests
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:unit

      - name: Install pinned Firebase CLI
        if: needs.changes.outputs.functions == 'true' || needs.changes.outputs.rules == 'true'
        run: npm install --global firebase-tools@15.28.1

      - name: Run retention race integration test
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:retention:integration

      - name: Run push registration cleanup integration test
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:notifications:integration

      - name: Run counter migration and reconciliation integration test
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:counters:integration

      - name: Run analytics v1 to v2 cutover integration test
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm run test:analytics-cutover:integration

      - name: Test Firestore and Storage rules
        if: needs.changes.outputs.rules == 'true'
        working-directory: functions
        run: npm run test:rules:all

  firebase:
    name: Firebase and rules
    needs:
      - changes
      - firebase_affected
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve required-check status
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          AFFECTED_RESULT: ${{ needs.firebase_affected.result }}
        run: |
          [[ "$CLASSIFICATION_RESULT" == "success" ]]
          [[ "$AFFECTED_RESULT" == "success" || "$AFFECTED_RESULT" == "skipped" ]]

  ios_affected:
    name: iOS affected checks
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Build app target
        run: >
          xcodebuild
          -project UkrainianCommunity.xcodeproj
          -scheme UkrainianCommunity
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/UkrainianCommunityDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build Release configuration
        if: needs.changes.outputs.ios_release == 'true'
        run: >
          xcodebuild
          -project UkrainianCommunity.xcodeproj
          -scheme UkrainianCommunity
          -configuration Release
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/UkrainianCommunityReleaseDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run Swift unit tests
        if: needs.changes.outputs.ios_unit == 'true'
        run: >
          xcodebuild
          -project UkrainianCommunity.xcodeproj
          -scheme UkrainianCommunity
          -configuration Debug
          -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5"
          -derivedDataPath "$RUNNER_TEMP/UkrainianCommunityDerivedData"
          CODE_SIGNING_ALLOWED=NO
          test
          -only-testing:UkrainianCommunityTests

      - name: Run UI smoke tests
        if: needs.changes.outputs.ios_ui == 'true'
        run: >
          xcodebuild
          -project UkrainianCommunity.xcodeproj
          -scheme UkrainianCommunity
          -configuration Debug
          -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5"
          -derivedDataPath "$RUNNER_TEMP/UkrainianCommunityDerivedData"
          -resultBundlePath "$RUNNER_TEMP/UkrainianCommunityUI.xcresult"
          CODE_SIGNING_ALLOWED=NO
          test
          -only-testing:UkrainianCommunityUITests/UkrainianCommunityUITests/testStartupSplashTransitionsToMainInterface
          -only-testing:UkrainianCommunityUITests/UkrainianCommunityUITests/testTabBarShowsFinalTabOrderWithoutLegacyTabs
          -only-testing:UkrainianCommunityUITests/UkrainianCommunityUITests/testEachTabOpensExpectedRootScreen
          -only-testing:UkrainianCommunityUITests/UkrainianCommunityUITests/testGuestProfileShowsAuthEntryPoints
          -only-testing:UkrainianCommunityUITests/UkrainianCommunityUITests/testOwnerAnalyticsSearchPeriodAndDetailJourney
          -only-testing:UkrainianCommunityUITests/UkrainianCommunityUITests/testOwnerAnalyticsSupportsDarkUkrainianAccessibilityText

      - name: Upload UI smoke test results
        if: always() && needs.changes.outputs.ios_ui == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: UkrainianCommunityUI-${{ github.run_attempt }}
          path: ${{ runner.temp }}/UkrainianCommunityUI.xcresult
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS build, unit and UI tests
    needs:
      - changes
      - ios_affected
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve required-check status
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          AFFECTED_RESULT: ${{ needs.ios_affected.result }}
        run: |
          [[ "$CLASSIFICATION_RESULT" == "success" ]]
          [[ "$AFFECTED_RESULT" == "success" || "$AFFECTED_RESULT" == "skipped" ]]
