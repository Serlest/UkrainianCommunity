name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase:
    name: Firebase and rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Audit production dependencies
        working-directory: functions
        run: npm run audit:prod

      - name: Type-check
        working-directory: functions
        run: npm run lint

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Test retention policy
        working-directory: functions
        run: npm run test:retention

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Test Firestore and Storage rules
        working-directory: functions
        run: npm run test:rules:all

  ios:
    name: iOS build, unit and UI tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate localization catalog
        run: python3 scripts/validate_localizations.py

      - name: Build app target
        run: >
          xcodebuild
          -project UkrainianCommunity.xcodeproj
          -scheme UkrainianCommunity
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/UkrainianCommunityDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build Release configuration
        run: >
          xcodebuild
          -project UkrainianCommunity.xcodeproj
          -scheme UkrainianCommunity
          -configuration Release
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/UkrainianCommunityReleaseDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run Swift unit tests
        run: >
          xcodebuild
          -project UkrainianCommunity.xcodeproj
          -scheme UkrainianCommunity
          -configuration Debug
          -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5"
          -derivedDataPath "$RUNNER_TEMP/UkrainianCommunityDerivedData"
          CODE_SIGNING_ALLOWED=NO
          test
          -only-testing:UkrainianCommunityTests

      - name: Run UI smoke tests
        run: >
          xcodebuild
          -project UkrainianCommunity.xcodeproj
          -scheme UkrainianCommunity
          -configuration Debug
          -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5"
          -derivedDataPath "$RUNNER_TEMP/UkrainianCommunityDerivedData"
          -resultBundlePath "$RUNNER_TEMP/UkrainianCommunityUI.xcresult"
          CODE_SIGNING_ALLOWED=NO
          test
          -only-testing:UkrainianCommunityUITests/UkrainianCommunityUITests/testStartupSplashTransitionsToMainInterface
          -only-testing:UkrainianCommunityUITests/UkrainianCommunityUITests/testEachTabOpensExpectedRootScreen
          -only-testing:UkrainianCommunityUITests/UkrainianCommunityUITests/testGuestProfileShowsAuthEntryPoints

      - name: Upload UI smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UkrainianCommunityUI-${{ github.run_attempt }}
          path: ${{ runner.temp }}/UkrainianCommunityUI.xcresult
          if-no-files-found: warn
          retention-days: 14
